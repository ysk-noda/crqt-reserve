# Supabase プロジェクト設定
# supabase/config.toml

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[functions.send-booking-email]
verify_jwt = false

[functions.notify-ending-soon]
verify_jwt = false

[functions.extend-booking]
verify_jwt = false

# 管理画面はログイン鍵（JWT）を送らずパスワードで照合するため false 必須。
# true のままデプロイすると管理画面が全部401になる（2026-11-20 追記）
[functions.admin-bookings]
verify_jwt = false
